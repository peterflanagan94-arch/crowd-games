<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crowd Games</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b14" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="glow">
  <main class="landing">
    <div>
      <h1 class="brand">Crowd<span>Games</span></h1>
      <p class="muted">Quizzes, bingo and music bingo for your crowd. They scan, you play.</p>
      <div class="cards">
        <div class="card">
          <h3>I'm the DJ</h3>
          <p class="muted">Open this on the big screen.</p>
          <a href="/host"><button class="primary" style="width:100%">Host a game</button></a>
        </div>
        <form class="card" action="/play">
          <h3>I'm playing</h3>
          <input name="room" placeholder="Room code" maxlength="4" autocapitalize="characters" autocomplete="off" required />
          <button class="secondary">Join</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
